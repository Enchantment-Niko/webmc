<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Eaglercraft 1.20.6</title>
    <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css" />
    <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body {
            height: 100%;
        }
        body{
            min-height:100vh;
            background: url("panorama.png") no-repeat center center;
            background-size: cover;
            display:flex;
            flex-direction:column;
        }
        .page-container {
            max-width:720px;
            margin:0 auto;
            padding:2rem 1.2rem 3rem;
            width:100%;
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .info-text{
            text-align:center;
            color: rgb(var(--mdui-color-on-surface-variant));
            margin-bottom: 2rem;
            line-height:1.6;
        }
        .btn-wrap{
            display:flex;
            gap:16px;
            flex-wrap:wrap;
            justify-content:center;
        }
        .btn-wrap mdui-button{
            min-width:160px;
        }
        h1 {
            font-size:22px;
            margin-bottom:0.5rem;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <mdui-card>
            <div style="padding:1.5rem;text-align:center;">
                <h1>Eaglercraft 1.20.6 Pre‑Release</h1>
                <div class="info-text">
                    <p>移植作者: eymenwsmc 汉化作者: @Enchantment‑Niko</p>
                    <p>哔哩哔哩: @EaglerWool</p>
                </div>
                <div class="btn-wrap">
                    <mdui-button href="chinese.html" variant="filled">汉化版</mdui-button>
                    <mdui-button href="english.html" variant="outlined">英文原版</mdui-button>
                </div>
            </div>
        </mdui-card>
    </div>
</body>
</html>
