<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Eaglercraft Blob加载器</title>
    <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css" />
    <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body {
            height: 100%;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgb(var(--mdui-color-surface));
            color: rgb(var(--mdui-color-on-surface));
        }
        .page-container {
            max-width:720px;
            margin:0 auto;
            padding:2rem 1.2rem 3rem;
            width:100%;
            flex:1;
        }
        .status-box {
            margin-top:12px;
            padding:12px;
            border-radius:var(--mdui-shape-corner-medium);
            background:rgb(var(--mdui-color-surface-variant));
            white-space:pre-wrap;
            font-family:monospace;
            font-size:0.9rem;
            color:rgb(var(--mdui-color-on-surface-variant));
        }
        .section-gap {
            margin:1rem 0;
        }
        .footer-wrap{
            margin-top:3rem;
            display:flex;
            gap:1rem;
            justify-content:center;
            flex-wrap:wrap;
        }
        #gameContainer{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            z-index:999;
            background:#000;
        }
        #backBtn{
            position:fixed;
            top:12px;
            left:12px;
            z-index:1000;
        }
        .btn-row{
            display:flex;
            gap:12px;
        }
        .btn-row mdui-button{
            flex:1;
        }
    </style>
</head>
<body>
    <div class="page-container" id="mainContent">
        <h1 style="text-align:center;margin-bottom:2rem">Eaglercraft Blob加载器</h1>
        <mdui-card>
            <div style="padding:1.5rem">
                <mdui-select id="versionSelect" label="选择游戏版本" class="section-gap">
                </mdui-select>
                <mdui-text-field id="rawUrl" label="GitHub Raw / HTML 地址（自定义）" class="section-gap"></mdui-text-field>
                <mdui-select id="proxySelect" label="选择代理节点（非 Github Raw 地址不支持代理）" class="section-gap" disabled></mdui-select>
                <div class="section-gap">
                    <mdui-checkbox id="autoSwitchNode" checked>失败自动切换节点</mdui-checkbox>
                </div>
                <div class="section-gap">
                    <mdui-checkbox id="enableCustomNode">启用自定义节点（需密码解锁）</mdui-checkbox>
                </div>
                <div class="section-gap">
                    <mdui-linear-progress id="progressBar"></mdui-linear-progress>
                    <div id="progressInfo" style="margin-top:6px;font-size:0.85rem;color:rgb(var(--mdui-color-on-surface-variant))">等待下载</div>
                </div>
                <div class="btn-row section-gap">
                    <mdui-button id="btnDownload" variant="filled">加载游戏（当前标签页）</mdui-button>
                    <mdui-button id="btnStop" variant="outlined" style="display:none">停止</mdui-button>
                </div>
                <div class="status-box" id="status">状态：等待操作</div>
            </div>
        </mdui-card>
        <div class="footer-wrap">
            <mdui-button variant="outlined" id="openSourceBtn">使用的项目</mdui-button>
            <mdui-button variant="outlined" href="https://github.com/Enchantment-Niko" target="_blank">Github 主页</mdui-button>
        </div>
    </div>
    <div id="gameContainer">
        <mdui-button id="backBtn" variant="tonal">返回加载器</mdui-button>
    </div>
    <mdui-dialog headline="自定义节点验证" class="custom-node-dialog">
        请输入访问密码以启用自定义节点
        <mdui-text-field id="customNodePwd" label="密码" type="password" class="section-gap"></mdui-text-field>
        <mdui-button slot="action" variant="text">取消</mdui-button>
        <mdui-button slot="action" variant="tonal" disabled>确认</mdui-button>
    </mdui-dialog>

    <mdui-dialog headline="使用的项目" class="opensource-dialog">
        <div class="section-gap">
            <mdui-button variant="filled" full-width href="https://www.mdui.org/zh-cn/" target="_blank">MDUI2</mdui-button>
        </div>
        <div class="section-gap">
            <mdui-button variant="filled" full-width href="https://mcjs-launcher-demo.144449.xyz/" target="_blank">MCJS启动器 测试版</mdui-button>
        </div>
        <mdui-button slot="action" variant="text">关闭</mdui-button>
    </mdui-dialog>

<script>
const VERSION_LIST = [
    {"version":"1.14.4","raw":"https://github.com/Enchantment-Niko/webmc/raw/refs/heads/main/1.14.4/index.html"},
    {"version":"1.16.5","raw":"https://github.com/Enchantment-Niko/webmc/raw/refs/heads/main/1.16.5/index.html"},
    {"version":"1.20.6","raw":"https://github.com/Enchantment-Niko/webmc/raw/refs/heads/main/1.20.6/chinese.html"},
    {"version":"1.21.11","raw":"https://github.com/Enchantment-Niko/webmc/raw/refs/heads/main/1.21.11/desktop.html"},
    {"version":"26.1.2","raw":"https://github.com/Enchantment-Niko/webmc/raw/refs/heads/main/26.1.2/novix-1.2.html"},
    {"version":"26.2","raw":"https://github.com/Enchantment-Niko/webmc/raw/refs/heads/main/26.2/index.html"},
    {"version":"1.6.4 Ultimate Modpack","raw":"https://github.com/Enchantment-Niko/webmc/raw/refs/heads/main/1.6.4-modpack/wasm.html"}
];
const PROXY_LIST = [
    {"name":"直连原始地址 (无代理)","url":""},
    {"name":"MCJS CDN (未填写)","url":""},
    {"name":"@239LAN 节点 (未填写)","url":""},
    {"name":"gh‑proxy.org（自动）","url":"https://gh-proxy.org"},
    {"name":"v4.gh‑proxy.org（仅IPv4）","url":"https://v4.gh-proxy.org"},
    {"name":"v6.gh‑proxy.org（仅IPv6）","url":"https://v6.gh-proxy.org"}
];
const CORRECT_PASSWORD = "admin";
const statusEl = document.getElementById('status');
const rawUrlEl = document.getElementById('rawUrl');
const versionSelectEl = document.getElementById('versionSelect');
const proxySelectEl = document.getElementById('proxySelect');
const btnDownload = document.getElementById('btnDownload');
const btnStop = document.getElementById('btnStop');
const progressBar = document.getElementById('progressBar');
const progressInfo = document.getElementById('progressInfo');
const gameContainer = document.getElementById("gameContainer");
const backBtn = document.getElementById("backBtn");
const autoSwitchNodeEl = document.getElementById("autoSwitchNode");
const enableCustomNodeEl = document.getElementById("enableCustomNode");
const customNodeDialog = document.querySelector(".custom-node-dialog");
const customNodePwd = document.getElementById("customNodePwd");
const customNodeActions = customNodeDialog.querySelectorAll('mdui-button[slot="action"]');
const customNodeCancel = customNodeActions[0];
const customNodeConfirm = customNodeActions[1];
const openSourceBtn = document.getElementById("openSourceBtn");
const openSourceDialog = document.querySelector(".opensource-dialog");
const openSourceCloseBtn = openSourceDialog.querySelector('mdui-button[slot="action"]');

let gameBlobUrl = null;
let customNodeAllowed = false;
let abortController = null;

function log(msg){
    statusEl.textContent = msg;
    console.log(msg);
}
function resetProgress(){
    progressBar.value = 0;
    progressBar.indeterminate = false;
    progressInfo.textContent = "等待下载";
}
function formatBytes(bytes){
    if(bytes < 1024) return `${bytes} B`;
    if(bytes < 1024*1024) return `${(bytes/1024).toFixed(1)} KB`;
    return `${(bytes/(1024*1024)).toFixed(1)} MB`;
}
function formatSpeed(bytesPerSec){
    if(bytesPerSec < 1024) return `${bytesPerSec.toFixed(1)} B/s`;
    if(bytesPerSec < 1024*1024) return `${(bytesPerSec/1024).toFixed(1)} KB/s`;
    return `${(bytesPerSec/(1024*1024)).toFixed(1)} MB/s`;
}

async function renderProxySelect(){
    while(proxySelectEl.firstChild){
        proxySelectEl.removeChild(proxySelectEl.firstChild);
    }
    for(const item of PROXY_LIST){
        const mi = document.createElement('mdui-menu-item');
        mi.value = JSON.stringify(item);
        mi.textContent = item.name;
        proxySelectEl.appendChild(mi);
    }
    await proxySelectEl.updateComplete;
    proxySelectEl.value = JSON.stringify(PROXY_LIST[0]);
}

async function renderVersionSelectUi(){
    while(versionSelectEl.firstChild){
        versionSelectEl.removeChild(versionSelectEl.firstChild);
    }
    for(const item of VERSION_LIST){
        const mi = document.createElement('mdui-menu-item');
        mi.value = item.raw;
        mi.textContent = item.version;
        versionSelectEl.appendChild(mi);
    }
    await versionSelectEl.updateComplete;
    versionSelectEl.value = VERSION_LIST[0].raw;
    rawUrlEl.value = VERSION_LIST[0].raw;
}

function getProxyUrl(originalRaw,proxyItem){
    if(proxyItem.url === ""){
        return originalRaw;
    }
    return `${proxyItem.url}/${originalRaw}`;
}
function loadGameByBlob(htmlStr){
    if(gameBlobUrl){
        URL.revokeObjectURL(gameBlobUrl);
    }
    const blob = new Blob([htmlStr],{type:"text/html"});
    gameBlobUrl = URL.createObjectURL(blob);
    gameContainer.innerHTML = "";
    const iframe = document.createElement("iframe");
    iframe.src = gameBlobUrl;
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "none";
    gameContainer.appendChild(iframe);
    gameContainer.style.display = "block";
    log("游戏页面已加载");
}
backBtn.onclick = ()=>{
    gameContainer.style.display = "none";
    gameContainer.innerHTML = "";
    if(gameBlobUrl){
        URL.revokeObjectURL(gameBlobUrl);
        gameBlobUrl = null;
    }
};
async function fetchWithProgress(url){
    abortController = new AbortController();
    const signal = abortController.signal;
    progressBar.indeterminate = true;
    const timeoutId = setTimeout(()=>abortController.abort(),12000);
    try{
        const resp = await fetch(url,{signal});
        clearTimeout(timeoutId);
        if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const total = Number(resp.headers.get('content-length'));
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let chunks = [];
        let received = 0;
        const startTime = performance.now();
        while(true){
            const {done,value} = await reader.read();
            if(done) break;
            chunks.push(value);
            received += value.length;
            const now = performance.now();
            const elapsed = (now - startTime)/1000;
            const speedBytesPerSec = elapsed>0 ? (received / elapsed) : 0;
            if(total && !Number.isNaN(total)){
                const pct = (received / total)*100;
                progressBar.indeterminate = false;
                progressBar.value = pct / 100;
                progressInfo.textContent = `${pct.toFixed(1)}% | ${formatBytes(received)} / ${formatBytes(total)} | ${formatSpeed(speedBytesPerSec)}`;
            }else{
                progressInfo.textContent = `已接收 ${formatBytes(received)} | ${formatSpeed(speedBytesPerSec)}（服务器未返回总大小）`;
            }
        }
        progressBar.indeterminate = false;
        progressBar.value = 1;
        const uint8 = new Uint8Array(received);
        let pos = 0;
        for(const chunk of chunks){
            uint8.set(chunk,pos);
            pos += chunk.length;
        }
        const htmlResult = decoder.decode(uint8);
        if(!htmlResult || htmlResult.trim().length === 0){
            throw new Error("返回空内容");
        }
        return htmlResult;
    }catch(err){
        clearTimeout(timeoutId);
        throw err;
    }
}
async function doDownload(){
    let raw = rawUrlEl.value.trim();
    if(!raw) raw = versionSelectEl.value;
    if(!raw){
        log("请选择版本或者填入github raw地址");
        return;
    }
    btnDownload.disabled = true;
    btnStop.style.display = "block";
    resetProgress();

    let startProxyItem;
    try{
        startProxyItem = JSON.parse(proxySelectEl.value);
    }catch(e){
        startProxyItem = PROXY_LIST[0];
    }
    const startIndex = PROXY_LIST.findIndex(p=>p.name === startProxyItem.name);
    let currentProxyIndex = startIndex;
    const autoSwitch = autoSwitchNodeEl.checked;
    let finalHtml = null;

    try{
        while(currentProxyIndex < PROXY_LIST.length){
            const proxyItem = PROXY_LIST[currentProxyIndex];
            log(`正在尝试节点: ${proxyItem.name}`);
            try{
                const pUrl = getProxyUrl(raw,proxyItem);
                log(`请求地址：${pUrl}`);
                const html = await fetchWithProgress(pUrl);
                finalHtml = html;
                break;
            }catch(e){
                if(e.name === "AbortError"){
                    log("已手动停止下载");
                    throw e;
                }
                log(`节点 ${proxyItem.name} 失败:${e.message}`);
                if(!autoSwitch){
                    log("自动切换节点已关闭，停止尝试");
                    break;
                }
                currentProxyIndex++;
                if(currentProxyIndex >= PROXY_LIST.length){
                    log("全部节点尝试完毕，全部失败");
                    break;
                }
            }
        }
        if(finalHtml !== null){
            log(`下载完成，正在加载游戏`);
            loadGameByBlob(finalHtml);
        }else{
            log("所有节点均无法完成下载，请检查网络");
            resetProgress();
        }
    }catch(err){
        if(err.name === "AbortError"){
            log("下载已中止");
        }
    }finally{
        btnDownload.disabled = false;
        btnStop.style.display = "none";
        abortController = null;
    }
}
btnStop.onclick = ()=>{
    if(abortController){
        abortController.abort();
    }
};
customNodePwd.addEventListener('input',()=>{
    customNodeConfirm.disabled = customNodePwd.value !== CORRECT_PASSWORD;
});
customNodeCancel.addEventListener("click",()=>{
    customNodeDialog.open = false;
    enableCustomNodeEl.checked = false;
});
customNodeConfirm.addEventListener("click",()=>{
    if(customNodePwd.value === CORRECT_PASSWORD){
        customNodeAllowed = true;
        proxySelectEl.disabled = false;
        customNodeDialog.open = false;
    }
});
enableCustomNodeEl.addEventListener("change",()=>{
    if(enableCustomNodeEl.checked && !customNodeAllowed){
        customNodeDialog.open = true;
        customNodePwd.value = "";
        customNodeConfirm.disabled = true;
    }else if(!enableCustomNodeEl.checked){
        proxySelectEl.disabled = true;
        customNodeAllowed = false;
    }
});
autoSwitchNodeEl.addEventListener('change',()=>{
    if(customNodeAllowed){
        proxySelectEl.disabled = autoSwitchNodeEl.checked;
    }
});
openSourceBtn.onclick = ()=>{
    openSourceDialog.open = true;
};
openSourceCloseBtn.onclick = ()=>{
    openSourceDialog.open = false;
};
btnDownload.onclick = ()=>{
    doDownload();
};
versionSelectEl.addEventListener('change',()=>{
    rawUrlEl.value = versionSelectEl.value;
});
(async function init(){
    await renderVersionSelectUi();
    await renderProxySelect();
    proxySelectEl.disabled = true;
})();
</script>
</body>
</html>
