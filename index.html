<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Eaglercraft 版本选择</title>
<link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css" />
<script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body {
    height: 100%;
}
body{
    min-height:100vh;
    background: rgb(var(--mdui-color-surface));
    color: rgb(var(--mdui-color-on-surface));
    display:flex;
    flex-direction:column;
}
.page-container {
    max-width:720px;
    margin:0 auto;
    padding:2rem 1.2rem 3rem;
    width:100%;
    flex:1;
}
h1{
    text-align:center;
    margin-bottom:0.5rem;
}
.subtitle{
    text-align:center;
    color: rgb(var(--mdui-color-on-surface-variant));
    margin-bottom:2rem;
}
.btn-group{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
}
.btn-group mdui-button{
    min-width:180px;
}
</style>
</head>
<body>
<div class="page-container">
    <h1>Eaglercraft</h1>
    <div class="subtitle">选择要启动的游戏版本</div>
    <mdui-card>
        <div style="padding:1.5rem">
            <div class="btn-group">
                <mdui-button onclick="location.href='assets/1.21.11.html'" variant="outlined">1.21.11‑u1beta‑WASM</mdui-button>
                <mdui-button onclick="location.href='assets/26.1.2.html'" variant="outlined">26.1.2-Final</mdui-button>
                <mdui-button onclick="location.href='assets/1.13.2.html'" variant="outlined">1.13.2 汉化版</mdui-button>
                <mdui-button onclick="location.href='assets/1.20.6.html'" variant="outlined">1.20.6 汉化版</mdui-button>
                <mdui-button onclick="location.href='assets/26.2.html'" variant="outlined">26.2 dev-0.6 中文版</mdui-button>
                <mdui-button onclick="location.href='assets/1.14.4.html'" variant="outlined">1.14.4（自带中文）</mdui-button>
                <mdui-button onclick="location.href='assets/1.16.5.html'" variant="outlined">1.16.5 汉化版（已成功爆破）</mdui-button>
                <mdui-button onclick="location.href='assets/0.6.1-pe.html'" variant="outlined">0.6.1 PE 携带版</mdui-button>
                <mdui-button onclick="location.href='assets/webforge-v9.html'" variant="outlined">WebForge 1.6.4 v9</mdui-button>
                <mdui-button onclick="location.href='loader.html'" variant="filled">Github raw加载器</mdui-button>
            </div>
        </div>
    </mdui-card>
</div>
</body>
</html>
